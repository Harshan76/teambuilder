{% extends "base.html" %}
{% block title %}Page Not Found - 404{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="display-1 text-muted fw-bold">404</div>
    <h2 class="h4 mb-3">Requested Resource Not Found</h2>
    <p class="text-secondary mb-4">The page or academic project record you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-arrow-left me-1"></i>Return to Portal</a>
</div>
{% endblock %}
