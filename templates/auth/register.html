{% extends "base.html" %}
{% block title %}Register - AI Group Project Team Builder{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h1 class="h3 fw-bold mb-1">Create Account</h1>
                    <p class="text-secondary small">Register to participate in project team matching</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label for="full_name" class="form-label fw-semibold">Full Name *</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" required placeholder="Jane Doe">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="role" class="form-label fw-semibold">Role *</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="student" selected>Student</option>
                                <option value="faculty">Faculty / Evaluator</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Academic Email *</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="user@college.edu">
                    </div>

                    <div class="row g-3 mb-3" id="student-extra-fields">
                        <div class="col-12 col-sm-6">
                            <label for="student_id" class="form-label fw-semibold">Student ID</label>
                            <input type="text" class="form-control" id="student_id" name="student_id" placeholder="STU2026-999">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="department" class="form-label fw-semibold">Academic Department</label>
                            <select class="form-select" id="department" name="department">
                                {% for dept in ALL_DEPARTMENTS %}
                                    <option value="{{ dept }}" {% if dept == 'Computer Science' %}selected{% endif %}>{{ dept }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-12 col-sm-6">
                            <label for="password" class="form-label fw-semibold">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" required minlength="6" placeholder="Min. 6 chars">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="confirm_password" class="form-label fw-semibold">Confirm Password *</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                            <i class="bi bi-person-check me-1"></i>Complete Registration
                        </button>
                    </div>
                </form>

                <div class="text-center text-secondary small">
                    Already registered? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
